<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Икона — Календарная мастерская</title><meta name="description" content="Православная икона: изображения, описание, история образа и дни празднования."><style>
:root{--ink:#19372c;--muted:#617168;--paper:#f5f2ea;--card:#fff;--line:#d9d4c4;--accent:#8c3d2d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:32px 20px 64px}a{color:#285d46}h1{font:clamp(30px,5vw,48px)/1.15 Georgia,serif;margin:18px 0}.meta{color:var(--muted)}.content{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.gallery button{padding:0;border:1px solid var(--line);background:#eee8db;cursor:zoom-in;border-radius:8px;overflow:hidden}.gallery img{display:block;width:100%;height:240px;object-fit:contain}.description{white-space:pre-line}.copy{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:white;cursor:pointer}.error{color:#8c3d2d}dialog{width:min(96vw,1050px);border:0;border-radius:14px;padding:0;background:#1f201e;color:white}dialog::backdrop{background:#000b}.modal{position:relative;padding:18px}.modal button{position:absolute;border:0;cursor:pointer}.modal .close{right:15px;top:12px;border-radius:50%;background:#fff;color:#222;width:36px;height:36px}.modal .nav{top:50%;transform:translateY(-50%);z-index:1;width:44px;height:56px;border-radius:8px;background:#ffffffe6;color:#19372c;font-size:32px;line-height:1}.modal .previous{left:16px}.modal .next{right:16px}.modal .nav:disabled{opacity:.35;cursor:default}.modal img{display:block;width:100%;max-height:82vh;object-fit:contain}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:72px;height:72px;object-fit:cover;border:2px solid transparent;cursor:pointer}.thumbs img.active{border-color:#e4bb71}
</style></head><body><main><a href="/icons.html">← Все иконы</a><p class="meta" id="status">Загрузка иконы…</p><article class="content" id="content" hidden><h1 id="title"></h1><button class="copy" id="copy">Скопировать ссылку</button><p class="meta" id="kind"></p><p id="dates"></p><div class="gallery" id="gallery"></div><section id="about" hidden><h2>История образа</h2><p class="description" id="description"></p></section></article></main><dialog id="lightbox"><div class="modal"><button class="close" aria-label="Закрыть">×</button><button class="nav previous" aria-label="Предыдущее изображение">←</button><button class="nav next" aria-label="Следующее изображение">→</button><img id="large" alt=""><div class="thumbs" id="thumbs"></div></div></dialog><script>
const $=id=>document.getElementById(id), API="https://bible-desktop.com/api/calendar/icons/";
const kindLabel=kind=>({"mother-of-god":"Икона Богородицы",savior:"Икона Спасителя",saint:"Икона святого",other:"Икона"}[kind]||kind);
function showLightbox(card,initial=0){const images=card.images||[];if(!images.length)return;const dialog=$("lightbox"),large=$("large"),thumbs=$("thumbs"),previous=dialog.querySelector(".previous"),next=dialog.querySelector(".next");let index=initial;const showImage=position=>{index=(position+images.length)%images.length;large.src=images[index].url;large.alt=card.title;[...thumbs.children].forEach((node,i)=>node.classList.toggle("active",i===index));};thumbs.replaceChildren(...images.map((image,i)=>{const thumb=new Image();thumb.src=image.url;thumb.alt=card.title;thumb.onclick=()=>showImage(i);return thumb;}));previous.disabled=next.disabled=images.length<2;previous.onclick=()=>showImage(index-1);next.onclick=()=>showImage(index+1);showImage(index);dialog.showModal();}
async function load(){const id=new URLSearchParams(location.search).get("id");if(!/^\d+$/.test(id||"")){ $("status").textContent="Икона не выбрана.";$("status").className="error";return;}try{const response=await fetch(API+encodeURIComponent(id),{headers:{Accept:"application/json"}});if(!response.ok)throw new Error(response.status===404?"Икона не найдена.":"Ошибка "+response.status);const {data:card}=await response.json();document.title=card.title+" — Иконы";$("title").textContent=card.title;$("kind").textContent=kindLabel(card.kind);const dates=card.dates||[];$("dates").textContent=dates.length?"Празднование: "+dates.map(item=>item.label||item.monthDay).join(", "):"Дата празднования не указана";$("gallery").replaceChildren(...(card.images||[]).map((image,index)=>{const button=document.createElement("button"),photo=new Image();photo.src=image.url;photo.alt=card.title;photo.loading="lazy";button.append(photo);button.onclick=()=>showLightbox(card,index);return button;}));if(card.description){$("description").textContent=card.description;$("about").hidden=false;}$("content").hidden=false;$("status").remove();$("copy").onclick=async()=>{await navigator.clipboard.writeText(location.href);$("copy").textContent="Ссылка скопирована";};}catch(error){$("status").textContent=error.message;$("status").className="error";}}
$("lightbox").querySelector(".close").onclick=()=>$("lightbox").close();load();
</script></body></html>
