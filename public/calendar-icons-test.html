<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Богородичные иконы — тестовая библиотека</title>
<style>body{margin:0;background:#f5f2ea;color:#243d31;font:16px/1.6 system-ui}main{max-width:1200px;margin:auto;padding:32px 20px}a{color:#285d46}h1{font:36px Georgia,serif}input{font:inherit;padding:12px;width:min(90%,500px);border:1px solid #b9c5ba;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;margin-top:24px}article{background:white;border:1px solid #dedacb;padding:16px;border-radius:12px}img{width:100%;height:280px;object-fit:contain}h2{font-size:17px}small{display:block;color:#657267}#status{min-height:24px}</style></head>
<body><main><a href="/calendar-api-test.html">← Проверка API календаря</a><h1>Богородичные иконы</h1>
<p>Первые партии импортированных изображений. Источник указан у каждого образа. Права и соответствие календарным памятям ещё проверяются; изображения не назначаются дню автоматически.</p>
<p><a href="/api/v1/calendar-icons/preview">Открыть JSON API</a></p><label>Поиск по названию<br><input id="search" type="search" placeholder="Например: Новодворская"></label><p id="status" role="status">Загрузка…</p><div class="grid" id="gallery"></div></main>
<script>
const status=document.getElementById('status'),gallery=document.getElementById('gallery');let images=[];
function render(){const q=document.getElementById('search').value.toLocaleLowerCase();gallery.replaceChildren();for(const item of images.filter(i=>i.title.toLocaleLowerCase().includes(q))){const card=document.createElement('article'),img=document.createElement('img'),title=document.createElement('h2'),link=document.createElement('a'),note=document.createElement('small');img.src=item.imageUrl;img.alt=item.title;img.loading='lazy';title.textContent=item.title;link.href=item.sourceUrl;link.textContent='Источник: '+item.sourceName;link.target='_blank';link.rel='noopener noreferrer';note.textContent='Тестовая партия · привязка не проверена';card.append(img,title,link,note);gallery.append(card);}}
document.getElementById('search').addEventListener('input',render);
fetch('/api/v1/calendar-icons/preview').then(async r=>{if(!r.ok)throw new Error('Не удалось получить библиотеку: '+r.status);return r.json();}).then(data=>{images=data.images;status.textContent=data.count+' изображений · '+data.cardCount+' названий икон';render();}).catch(e=>status.textContent=e.message);
</script></body></html>
