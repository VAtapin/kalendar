openapi: 3.1.0
info:
  title: Orthodox Calendar API
  version: 1.0.0
  license:
    name: Internal project
    identifier: LicenseRef-Proprietary
  description: >-
    Локальный API православного календаря: Пасха, календарные события,
    многодневные посты и информационное правило трапезы.
servers:
  - url: http://127.0.0.1:8787
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Состояние сервиса и версии данных
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [ok]
                    properties:
                      ok:
                        type: boolean
                        const: true
                  - $ref: "#/components/schemas/Metadata"
        "4XX":
          $ref: "#/components/responses/ClientError"
  /v1:
    get:
      operationId: getApiMetadata
      summary: Состояние API и версии данных
      responses:
        "200":
          description: API работает
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [ok]
                    properties:
                      ok:
                        type: boolean
                        const: true
                  - $ref: "#/components/schemas/Metadata"
        "4XX":
          $ref: "#/components/responses/ClientError"
  /v1/day/{date}:
    get:
      operationId: getCalendarDay
      summary: Календарь и правило трапезы на один день
      parameters:
        - name: date
          in: path
          required: true
          description: Григорианская дата в формате YYYY-MM-DD
          schema:
            type: string
            format: date
            examples: ["2027-04-25"]
        - $ref: "#/components/parameters/Profile"
      responses:
        "200":
          description: Рассчитанный день
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarDay"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/year/{year}:
    get:
      operationId: getCalendarYear
      summary: Полный календарный год
      parameters:
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/Profile"
      responses:
        "200":
          description: Все дни, Пасха и многодневные посты года
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarYear"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/pascha/{year}:
    get:
      operationId: getOrthodoxPascha
      summary: Дата православной Пасхи
      parameters:
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Дата Пасхи
          content:
            application/json:
              schema:
                type: object
                required: [metadata, year, pascha]
                properties:
                  metadata:
                    $ref: "#/components/schemas/Metadata"
                  year:
                    type: integer
                    minimum: 1900
                    maximum: 2200
                  pascha:
                    type: string
                    format: date
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  parameters:
    Profile:
      name: profile
      in: query
      required: false
      description: Профиль правила трапезы; по умолчанию typikon-strict
      schema:
        $ref: "#/components/schemas/ProfileId"
    Year:
      name: year
      in: path
      required: true
      schema:
        type: integer
        minimum: 1900
        maximum: 2200
        examples: [2027]
  responses:
    BadRequest:
      description: Неверная дата или год
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ClientError:
      description: Ошибка HTTP-запроса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ProfileId:
      type: string
      enum: [typikon-strict, parish]
    Metadata:
      type: object
      required:
        - apiVersion
        - calendarDataSource
        - fastingProfileId
        - fastingRulesVersion
        - sourceUrls
      properties:
        apiVersion:
          type: string
          const: 1.0.0
        calendarDataSource:
          type: string
        fastingProfileId:
          $ref: "#/components/schemas/ProfileId"
        fastingRulesVersion:
          type: string
        sourceUrls:
          type: array
          items:
            type: string
            format: uri
    CalendarDate:
      type: object
      required: [year, month, day]
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
    Event:
      type: object
      required: [id, title, typeCode, priority, ruleKind]
      properties:
        id:
          type: string
        title:
          type: string
        shortTitle:
          type: string
        veryShortTitle:
          type: string
        typeCode:
          type: integer
        priority:
          type: integer
        ruleKind:
          type: string
        styleToken:
          type: string
    FoodRule:
      type: object
      required: [id, label, color]
      properties:
        id:
          type: string
          enum:
            - no-fast
            - fast
            - fish
            - oil
            - boiled-no-oil
            - dry-eating
            - strict-fast
            - dairy-eggs
        label:
          type: string
        color:
          type: string
    Fasting:
      type: object
      required: [date, profileId, foodRule, memorial, reason, sourceUrls]
      properties:
        date:
          $ref: "#/components/schemas/CalendarDate"
        profileId:
          $ref: "#/components/schemas/ProfileId"
        period:
          type: string
          enum:
            - great-lent
            - apostles-fast
            - dormition-fast
            - nativity-fast
        foodRule:
          $ref: "#/components/schemas/FoodRule"
        memorial:
          type: boolean
        reason:
          type: string
        sourceUrls:
          type: array
          items:
            type: string
            format: uri
    FastingPeriod:
      type: object
      required: [id, label, start, finish]
      properties:
        id:
          type: string
          enum:
            - great-lent
            - apostles-fast
            - dormition-fast
            - nativity-fast
        label:
          type: string
        start:
          $ref: "#/components/schemas/CalendarDate"
        finish:
          $ref: "#/components/schemas/CalendarDate"
    CalendarDay:
      type: object
      required: [date, oldStyleDate, weekday, events, fasting]
      properties:
        date:
          type: string
          format: date
        oldStyleDate:
          type: string
          format: date
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 — воскресенье, 1 — понедельник, ..., 6 — суббота
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        fasting:
          $ref: "#/components/schemas/Fasting"
    CalendarYear:
      type: object
      required: [metadata, year, pascha, fastingPeriods, days]
      properties:
        metadata:
          $ref: "#/components/schemas/Metadata"
        year:
          type: integer
          minimum: 1900
          maximum: 2200
        pascha:
          type: string
          format: date
        fastingPeriods:
          type: array
          items:
            $ref: "#/components/schemas/FastingPeriod"
        days:
          type: array
          minItems: 365
          maxItems: 366
          items:
            $ref: "#/components/schemas/CalendarDay"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_date, invalid_year, not_found, method_not_allowed]
