# Дополнительные директивы nginx для субдомена kalender.georg-kloster.ru в Plesk.
location /api/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 6m;
}

# Собранное приложение лежит в dist. В настройках Document root субдомена
# укажите /var/www/vhosts/georg-kloster.ru/kalender.georg-kloster.ru/dist.
location / {
    try_files $uri $uri/ /index.html;
}
