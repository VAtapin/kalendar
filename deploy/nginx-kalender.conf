# Дополнительные директивы nginx для субдомена kalender.georg-kloster.ru в Plesk.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

location /api/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    # PDF приходит блоками по 4 МБ, а общий проект может содержать встроенные
    # фотографии и ограничен самим API значением 100 МБ.
    client_max_body_size 105m;
}

# Vite добавляет хеш к именам программных файлов: их можно хранить в кеше долго.
location ~* ^/assets/.*-[A-Za-z0-9_-]{8,}\.(?:js|css)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

location ~* \.(?:woff2?|ttf|otf)$ {
    try_files $uri =404;
    expires 30d;
}

location ~* \.(?:png|jpe?g|webp|svg)$ {
    try_files $uri =404;
    expires 1d;
}

location = /data/MemoryDays.xml {
    try_files $uri =404;
    expires 1d;
}

location = /index.html {
    expires -1;
    try_files $uri =404;
}

# Собранное приложение лежит в dist. В настройках Document root субдомена
# укажите /var/www/vhosts/georg-kloster.ru/kalender.georg-kloster.ru/dist.
location / {
    try_files $uri $uri/ /index.html;
}
